services:
  # === PostgreSQL Database ===
  postgres:
    image: postgres:15-alpine
    container_name: hmr_postgres
    restart: always
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-hmr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hmr_secret}
      POSTGRES_DB: ${DB_NAME:-hmr_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hmr} -d ${DB_NAME:-hmr_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # === FastAPI Backend ===
  hmr-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hmr_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-hmr}
      - DB_PASSWORD=${DB_PASSWORD:-hmr_secret}
      - DB_NAME=${DB_NAME:-hmr_db}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # === React Frontend (Vite) ===
  hmr-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hmr_app
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_PORT=5173
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      hmr-backend:
        condition: service_healthy

volumes:
  pgdata:
