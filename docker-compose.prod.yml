services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-hmr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hmr_secret}
      POSTGRES_DB: ${DB_NAME:-hmr_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hmr} -d ${DB_NAME:-hmr_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  hmr-backend:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-hmr}
      - DB_PASSWORD=${DB_PASSWORD:-hmr_secret}
      - DB_NAME=${DB_NAME:-hmr_db}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  hmr-app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      hmr-backend:
        condition: service_healthy

volumes:
  pgdata: